<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Cloud POS & Billing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 pb-10">

  <!-- Header -->
  <header class="bg-indigo-900 text-white p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img id="storeLogo" class="w-10 h-10 rounded-full bg-white p-1 hidden object-cover" alt="Logo">
        <div>
          <h1 id="storeName" class="font-bold text-lg leading-tight">Smart POS</h1>
          <p id="storeTagline" class="text-xs text-indigo-200">Cloud Billing System</p>
        </div>
      </div>
      <button onclick="openConfig()" class="bg-indigo-700 hover:bg-indigo-600 px-3 py-1.5 rounded-lg text-xs font-semibold">⚙️ Config</button>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <!-- Active Navigation -->
    <div class="flex gap-2">
      <button onclick="switchTab('billing')" id="tabBilling" class="flex-1 py-2 font-bold text-sm bg-indigo-600 text-white rounded-lg shadow">🧾 New Bill</button>
      <button onclick="switchTab('stock')" id="tabStock" class="flex-1 py-2 font-bold text-sm bg-slate-200 text-slate-700 rounded-lg">📦 Stock</button>
      <button onclick="switchTab('history')" id="tabHistory" class="flex-1 py-2 font-bold text-sm bg-slate-200 text-slate-700 rounded-lg">📊 Sales</button>
    </div>

    <!-- BILLING VIEW -->
    <div id="viewBilling" class="space-y-4">
      
      <!-- Item Add Form -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <h3 class="font-bold text-sm text-slate-700">Add Item to Cart</h3>
        
        <div>
          <label class="text-xs font-semibold text-slate-500">Select Item</label>
          <select id="itemSelect" onchange="onItemSelect()" class="w-full border p-2 rounded-lg text-sm bg-slate-50">
            <option value="">-- Select Product --</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-slate-500">Price (LKR)</label>
            <input type="number" id="itemPrice" class="w-full border p-2 rounded-lg text-sm" placeholder="0.00">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Quantity</label>
            <input type="number" id="itemQty" value="1" min="1" class="w-full border p-2 rounded-lg text-sm">
          </div>
        </div>

        <button onclick="addToCart()" class="w-full bg-slate-800 text-white py-2 rounded-lg text-sm font-bold hover:bg-slate-900">+ Add to Invoice</button>
      </div>

      <!-- Cart Table -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h3 class="font-bold text-sm text-slate-700 mb-2">Cart Items</h3>
        <div id="cartList" class="divide-y text-sm">
          <p class="text-slate-400 text-center py-4 text-xs">No items added yet</p>
        </div>
      </div>

      <!-- Delivery & Payment Section -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        
        <!-- Payment Type -->
        <div>
          <label class="text-xs font-bold text-slate-700">Payment Type</label>
          <select id="paymentType" onchange="toggleDeliveryUI()" class="w-full border p-2 rounded-lg text-sm bg-slate-50 mt-1">
            <option value="Cash">Cash Sale</option>
            <option value="Card">Card Payment</option>
            <option value="Online Transfer">Online Transfer</option>
            <option value="COD">Cash on Delivery (COD)</option>
          </select>
        </div>

        <!-- Online Delivery Specific Fields -->
        <div id="deliverySection" class="p-3 bg-indigo-50/50 rounded-lg border border-indigo-100 space-y-2 hidden">
          <h4 class="font-bold text-xs text-indigo-900">🚚 Delivery Details</h4>
          
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-600">Courier Service</label>
              <select id="courierName" class="w-full text-xs border p-2 rounded bg-white">
                <option value="Pronto">Pronto</option>
                <option value="Domex">Domex</option>
                <option value="Prompt Xpress">Prompt Xpress</option>
                <option value="Fardar">Fardar</option>
                <option value="Grasshoppers">Grasshoppers</option>
                <option value="Other Courier">Other Courier</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-slate-600">Delivery Charge (LKR)</label>
              <input type="number" id="deliveryFee" value="0" oninput="calculateTotal()" class="w-full text-xs border p-2 rounded bg-white" placeholder="350">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-600">Waybill / Tracking No</label>
              <input type="text" id="trackingNo" class="w-full text-xs border p-2 rounded bg-white" placeholder="Ex: PR-9901">
            </div>
            <div>
              <label class="text-xs text-slate-600">COD Status</label>
              <select id="codStatus" class="w-full text-xs border p-2 rounded bg-white font-bold text-amber-700">
                <option value="COD Pending">Pending Collection</option>
                <option value="Paid">Paid Upfront</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Customer Details -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-slate-500">Customer Name</label>
            <input type="text" id="custName" class="w-full border p-2 rounded-lg text-sm" placeholder="Optional">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Phone (for WhatsApp)</label>
            <input type="text" id="custPhone" class="w-full border p-2 rounded-lg text-sm" placeholder="07X XXX XXXX">
          </div>
        </div>

        <!-- Totals & Actions -->
        <div class="pt-2 border-t space-y-2">
          <div class="flex justify-between text-sm">
            <span class="text-slate-500">Subtotal:</span>
            <span id="subTotalTxt" class="font-semibold">LKR 0.00</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-slate-500">Delivery Fee:</span>
            <span id="deliveryFeeTxt" class="font-semibold">LKR 0.00</span>
          </div>
          <div class="flex justify-between text-base font-bold text-indigo-900 pt-1 border-t">
            <span>Grand Total:</span>
            <span id="grandTotalTxt">LKR 0.00</span>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-2">
            <button onclick="processBill('whatsapp')" class="bg-emerald-600 text-white py-2.5 rounded-lg font-bold text-sm flex items-center justify-center gap-1 hover:bg-emerald-700">💬 WhatsApp Bill</button>
            <button onclick="processBill('pdf')" class="bg-indigo-600 text-white py-2.5 rounded-lg font-bold text-sm flex items-center justify-center gap-1 hover:bg-indigo-700">📄 Print / PDF</button>
          </div>
        </div>

      </div>
    </div>

    <!-- STOCK VIEW -->
    <div id="viewStock" class="space-y-4 hidden">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <h3 class="font-bold text-sm text-slate-700">Add / Update Product</h3>
        <input type="text" id="stkName" class="w-full border p-2 rounded-lg text-sm" placeholder="Item Name">
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="stkPrice" class="w-full border p-2 rounded-lg text-sm" placeholder="Price (LKR)">
          <input type="number" id="stkQty" class="w-full border p-2 rounded-lg text-sm" placeholder="Stock Qty">
        </div>
        <button onclick="saveStock()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold text-sm">Save Product</button>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h3 class="font-bold text-sm text-slate-700 mb-2">Current Inventory</h3>
        <div id="stockList" class="divide-y text-sm"></div>
      </div>
    </div>

    <!-- SALES HISTORY -->
    <div id="viewHistory" class="space-y-4 hidden">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h3 class="font-bold text-sm text-slate-700 mb-2">Recent Bills</h3>
        <div id="historyList" class="divide-y text-sm"></div>
      </div>
    </div>

  </main>

  <!-- CONFIG MODAL -->
  <div id="configModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl p-5 max-w-sm w-full space-y-3 max-h-[90vh] overflow-y-auto">
      <h3 class="font-bold text-lg text-slate-800">System Configuration</h3>
      <input type="password" id="cfgPin" class="w-full border p-2 rounded text-sm" placeholder="Master PIN (9421)">
      
      <div id="cfgFields" class="space-y-2 hidden">
        <input type="text" id="cfgKey" class="w-full border p-2 rounded text-sm" placeholder="Client Key (e.g. macaria)">
        <input type="text" id="cfgName" class="w-full border p-2 rounded text-sm" placeholder="Business Name">
        <input type="text" id="cfgTag" class="w-full border p-2 rounded text-sm" placeholder="Tagline">
        <input type="text" id="cfgPhone" class="w-full border p-2 rounded text-sm" placeholder="Phone">
        <select id="cfgType" class="w-full border p-2 rounded text-sm">
          <option value="Retail">Retail Store</option>
          <option value="Online Delivery">Online Delivery</option>
          <option value="Clothing">Clothing</option>
          <option value="Computer">Computer / Tech</option>
        </select>
        <input type="text" id="cfgLogo" class="w-full border p-2 rounded text-sm" placeholder="Logo Image URL">
        <input type="date" id="cfgExpiry" class="w-full border p-2 rounded text-sm">
        <button onclick="saveConfig()" class="w-full bg-emerald-600 text-white py-2 rounded font-bold text-sm">Save Settings to Cloud</button>
      </div>

      <div class="flex justify-between pt-2">
        <button onclick="authConfig()" id="btnAuth" class="bg-indigo-600 text-white px-4 py-1.5 rounded text-sm font-bold">Unlock</button>
        <button onclick="closeConfig()" class="bg-slate-300 text-slate-700 px-4 py-1.5 rounded text-sm font-bold">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Init
    const firebaseConfig = { databaseURL: "https://pos-billing-default-rtdb.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Client Context
    const urlParams = new URLSearchParams(window.location.search);
    const clientKey = urlParams.get('client') || 'default';

    let config = { businessName: "Smart POS", businessType: "Retail" };
    let cart = [];
    let stockData = {};

    // Load Config
    db.ref('clients/' + clientKey + '/config').on('value', snap => {
      if (snap.exists()) {
        config = snap.val();
        
        // Expiry Check
        if (config.expiry && new Date(config.expiry) < new Date()) {
          document.body.innerHTML = `<div class="p-10 text-center font-bold text-red-600 text-xl">⚠️ License Expired!<br><span class="text-sm text-slate-500 font-normal">Please contact administrator to renew.</span></div>`;
          return;
        }

        document.getElementById('storeName').innerText = config.businessName || "Smart POS";
        document.getElementById('storeTagline').innerText = config.tagline || "Cloud Billing System";
        if (config.logo) {
          const logoEl = document.getElementById('storeLogo');
          logoEl.src = config.logo;
          logoEl.classList.remove('hidden');
        }
        toggleDeliveryUI();
      }
    });

    // Load Stock
    db.ref('clients/' + clientKey + '/stock').on('value', snap => {
      stockData = snap.val() || {};
      renderStock();
      renderItemSelect();
    });

    function toggleDeliveryUI() {
      const pType = document.getElementById('paymentType').value;
      const isOnlineType = config.businessType === "Online Delivery";
      const delSec = document.getElementById('deliverySection');
      
      if (isOnlineType || pType === 'COD') {
        delSec.classList.remove('hidden');
      } else {
        delSec.classList.add('hidden');
      }
      calculateTotal();
    }

    function renderItemSelect() {
      const sel = document.getElementById('itemSelect');
      sel.innerHTML = '<option value="">-- Select Product --</option>';
      for (let id in stockData) {
        sel.innerHTML += `<option value="${id}">${stockData[id].name} (Qty: ${stockData[id].qty})</option>`;
      }
    }

    function onItemSelect() {
      const id = document.getElementById('itemSelect').value;
      if (id && stockData[id]) {
        document.getElementById('itemPrice').value = stockData[id].price;
      }
    }

    function addToCart() {
      const id = document.getElementById('itemSelect').value;
      const price = parseFloat(document.getElementById('itemPrice').value) || 0;
      const qty = parseInt(document.getElementById('itemQty').value) || 1;

      if (!id || price <= 0) return alert('Select item and price');

      cart.push({ id, name: stockData[id].name, price, qty });
      renderCart();
    }

    function renderCart() {
      const el = document.getElementById('cartList');
      if (!cart.length) return el.innerHTML = `<p class="text-slate-400 text-center py-4 text-xs">No items added yet</p>`;
      
      el.innerHTML = cart.map((item, i) => `
        <div class="flex justify-between items-center py-2">
          <div>
            <p class="font-bold text-slate-800">${item.name}</p>
            <p class="text-xs text-slate-500">${item.qty} x LKR ${item.price}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-indigo-900">LKR ${(item.qty * item.price).toFixed(2)}</span>
            <button onclick="cart.splice(${i},1);renderCart();" class="text-red-500 font-bold px-1">✕</button>
          </div>
        </div>
      `).join('');
      calculateTotal();
    }

    function calculateTotal() {
      let sub = cart.reduce((sum, item) => sum + (item.qty * item.price), 0);
      let fee = 0;
      const delSec = document.getElementById('deliverySection');
      if (!delSec.classList.contains('hidden')) {
        fee = parseFloat(document.getElementById('deliveryFee').value) || 0;
      }

      document.getElementById('subTotalTxt').innerText = `LKR ${sub.toFixed(2)}`;
      document.getElementById('deliveryFeeTxt').innerText = `LKR ${fee.toFixed(2)}`;
      document.getElementById('grandTotalTxt').innerText = `LKR ${(sub + fee).toFixed(2)}`;
    }

    function processBill(type) {
      if (!cart.length) return alert('Add items to cart first');

      let sub = cart.reduce((sum, item) => sum + (item.qty * item.price), 0);
      let fee = parseFloat(document.getElementById('deliveryFee').value) || 0;
      let pType = document.getElementById('paymentType').value;
      let isCOD = pType === 'COD';

      let billData = {
        items: cart,
        subtotal: sub,
        deliveryFee: fee,
        grandTotal: sub + fee,
        custName: document.getElementById('custName').value,
        custPhone: document.getElementById('custPhone').value,
        paymentType: pType,
        courier: isCOD || config.businessType === "Online Delivery" ? document.getElementById('courierName').value : '',
        trackingNo: document.getElementById('trackingNo').value,
        codStatus: isCOD ? document.getElementById('codStatus').value : 'Paid',
        date: new Date().toISOString()
      };

      // Auto Deduct Stock
      cart.forEach(item => {
        if (stockData[item.id]) {
          let newQty = (stockData[item.id].qty || 0) - item.qty;
          db.ref('clients/' + clientKey + '/stock/' + item.id + '/qty').set(Math.max(0, newQty));
        }
      });

      // Save Sale
      db.ref('clients/' + clientKey + '/sales').push(billData);

      if (type === 'whatsapp') {
        let phone = billData.custPhone.replace(/[^0-9]/g, '');
        if (!phone) return alert('Enter customer phone number');
        if (phone.startsWith('0')) phone = '94' + phone.substring(1);

        let msg = `*${config.businessName}*\n🧾 *INVOICE*\n------------------\n`;
        cart.forEach(i => msg += `${i.name} x${i.qty} = LKR ${(i.qty * i.price).toFixed(2)}\n`);
        msg += `------------------\nSubtotal: LKR ${sub.toFixed(2)}\n`;
        if (fee > 0) msg += `🚚 Delivery Charge: LKR ${fee.toFixed(2)}\n`;
        msg += `💰 *Grand Total: LKR ${(sub + fee).toFixed(2)}*\n`;
        msg += `💳 Payment: ${pType}`;
        if (isCOD) msg += ` (${billData.codStatus})`;
        if (billData.courier) msg += `\n📦 Courier: ${billData.courier}`;
        if (billData.trackingNo) msg += `\n📌 Waybill No: ${billData.trackingNo}`;
        msg += `\n\nThank you for doing business with us!`;

        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
      } else {
        alert('Bill processed successfully!');
      }

      cart = [];
      renderCart();
    }

    // Stock Mgmt
    function saveStock() {
      let name = document.getElementById('stkName').value;
      let price = parseFloat(document.getElementById('stkPrice').value) || 0;
      let qty = parseInt(document.getElementById('stkQty').value) || 0;
      if (!name) return;

      db.ref('clients/' + clientKey + '/stock').push({ name, price, qty });
      document.getElementById('stkName').value = '';
      document.getElementById('stkPrice').value = '';
      document.getElementById('stkQty').value = '';
    }

    function renderStock() {
      const el = document.getElementById('stockList');
      el.innerHTML = Object.keys(stockData).map(id => `
        <div class="flex justify-between py-2 items-center">
          <div>
            <p class="font-bold text-slate-800">${stockData[id].name}</p>
            <p class="text-xs text-slate-500">LKR ${stockData[id].price} | Qty: ${stockData[id].qty}</p>
          </div>
          <button onclick="db.ref('clients/${clientKey}/stock/${id}').remove()" class="text-red-500 text-xs font-bold">Delete</button>
        </div>
      `).join('');
    }

    // Config Auth
    function openConfig() { document.getElementById('configModal').classList.remove('hidden'); }
    function closeConfig() { document.getElementById('configModal').classList.add('hidden'); }
    
    function authConfig() {
      if (document.getElementById('cfgPin').value === '9421') {
        document.getElementById('cfgFields').classList.remove('hidden');
        document.getElementById('btnAuth').classList.add('hidden');
        document.getElementById('cfgKey').value = clientKey;
        document.getElementById('cfgName').value = config.businessName || '';
        document.getElementById('cfgTag').value = config.tagline || '';
        document.getElementById('cfgPhone').value = config.phone || '';
        document.getElementById('cfgType').value = config.businessType || 'Retail';
        document.getElementById('cfgLogo').value = config.logo || '';
        document.getElementById('cfgExpiry').value = config.expiry || '';
      } else alert('Invalid PIN');
    }

    function saveConfig() {
      let key = document.getElementById('cfgKey').value.trim();
      let data = {
        businessName: document.getElementById('cfgName').value,
        tagline: document.getElementById('cfgTag').value,
        phone: document.getElementById('cfgPhone').value,
        businessType: document.getElementById('cfgType').value,
        logo: document.getElementById('cfgLogo').value,
        expiry: document.getElementById('cfgExpiry').value
      };
      db.ref('clients/' + key + '/config').set(data).then(() => {
        alert('Config Saved!');
        closeConfig();
      });
    }

    function switchTab(tab) {
      ['Billing', 'Stock', 'History'].forEach(t => {
        document.getElementById('view' + t).classList.add('hidden');
        document.getElementById('tab' + t).className = 'flex-1 py-2 font-bold text-sm bg-slate-200 text-slate-700 rounded-lg';
      });
      document.getElementById('view' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
      document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).className = 'flex-1 py-2 font-bold text-sm bg-indigo-600 text-white rounded-lg shadow';
    }
  </script>
</body>
</html>
